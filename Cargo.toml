[package]
name = "onparmak"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Zarif, terminal tabanlı Türkçe on parmak klavye eğitmeni (F ve Q)"
license = "MIT"
readme = "README.md"
keywords = ["typing", "tui", "turkish", "keyboard", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
