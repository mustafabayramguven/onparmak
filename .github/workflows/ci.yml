name: Arch

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Araçlar
        run: pacman -Syu --noconfirm --needed rust gcc git tar gzip

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Testler
        run: cargo test

      - name: Derle
        run: cargo build --release

      - name: Paketle
        run: |
          name=onparmak-x86_64-linux
          mkdir -p "dist/$name"
          cp target/release/onparmak README.md LICENSE packaging/onparmak.desktop "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: onparmak-x86_64-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
